[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vex_shell"
version = "0.2.7.10"
description = "Lean AI agent that works as u expect"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "dotenv>=0.9.9",
    "grandalf>=0.8",
    "langchain>=1.3.14",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.0",
    "langchain-openrouter>=0.2.7",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "mcp>=2.0.0",
    "pathspec>=1.1.1",
    "pillow>=12.3.0",
    "pydantic-settings>=2.14.2",
    "selectolax>=0.4.11",
]

# CLI module
[project.optional-dependencies]
cli = [
    "prompt-toolkit>=3.0.52",
    "rich>=15.0.0"
]

[project.scripts]
vex = "vex_shell.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"templates" = ["templates/*"]
