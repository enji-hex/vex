[project]
name = "vex_shell"
version = "0.2.0"
description = "Lean AI agent that works as u expect"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "bs4>=0.0.2",
    "curl-cffi>=0.15.0",
    "dotenv>=0.9.9",
    "grandalf>=0.8",
    "html-text>=0.7.1",
    "langchain>=1.3.14",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.0",
    "langchain-openrouter>=0.2.7",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "mcp>=2.0.0",
    "prompt-toolkit>=3.0.52",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "selectolax>=0.4.11",
]

[project.scripts]
vex = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"templates" = ["*"]
