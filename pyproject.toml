[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vex_shell"
version = "1.1"
description = "Lean AI agent that works as U expect"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "dotenv>=0.9.9",
    "grandalf>=0.8",
    "langchain>=1.3.14",
    "langchain-core>=1.6.5",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.0",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "mcp>=2.0.0",
    "msgspec>=0.21.1",
    "pathspec>=1.1.1",
    "pillow>=12.3.0",
    "pydantic-settings>=2.14.2",
    "rich>=15.0.0",
    "selectolax>=0.4.11",
    "prompt-toolkit>=3.0.52",
    "rich>=15.0.0",
    "socksio>=1.0.0",
    "pypdf>=6.21.4",
]

[tool.ruff.lint]
# Ignore executable bit issues and legacy typing rule globally
ignore = [
    "EXE002",  # Missing shebang on executable file
]


[project.scripts]
vex = "vex_cli.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vex_cli.web.static" = ["*", "**/*"]
"vex_shell.templates" = ["*"]
