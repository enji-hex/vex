[chat]
# control imported MCP tools only, core tools available always
use_mcp =  false

# count of messages loaded in console (not sliding window)
load_last_n =  10

# keep/hide tool-info boxes
keep_tool_logs =  false
# optional, ignored if empty
custom_cwd = "" 

[verification]
check_command = ""
observe_command = ""

[permissions]
# for both read and write prefixes follow rules applies
# set patterns to ['*'] to allow full access 
# set patterns to [] to deny access
# use standard glob patterns 

# you can set even not existing directories, agent will create it automatically
read_patterns = ['**/*']
write_patterns = []

[model]
# ollama / openrouter
provider = "openrouter"
# optional 
# llm_url = "http://localhost:11434/v1" 


use_vision = false # image read support
# name = "openai/gpt-oss-120b"

# name = "qwen2.5-coder:latest"
name = "google/gemma-4-26b-a4b-it"

# set to -1 set infinity length
context_sliding_window = 10
temperature = 0
max_completion_tokens = 8000
timeout =  60
max_retries = 3

# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
[model.reasoning]
# max_tokens = 2000
effort = "low"


