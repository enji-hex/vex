# models
# 1.  "inclusionai/ling-3.0-flash:free"

model:
  name: "openai/gpt-oss-120b"
  api_key: "user api key"
  temperature: 0
  max_completion_tokens: 8192
  timeout: 60
  max_retries: 3
chat:
  use_mcp: false
  # count of messages loaded in console (not sliding window)
  load_last_n: -1
  # keep/hide tool-info boxes
  keep_tool_logs: true
