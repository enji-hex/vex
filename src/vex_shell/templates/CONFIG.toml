logging_level = "info" # info if not present, use standard python logging levels

[chat]
# control imported MCP tools only, core tools available always
use_mcp =  false

# count of messages loaded in console (not sliding window)
load_last_n =  10

# keep/hide tool-info boxes
keep_tool_logs =  true
# optional, ignored if empty
custom_cwd = ""
autosync_cwd_tree = false
# Auto read each file written by LLM
cache_on_write    = false
theme = "Land-of-Ooo"

[verification]
check_command = ""
observe_command = ""

[permissions]
# for both read and write prefixes follow rules applies
# set patterns to ['*'] to allow full access 
# set patterns to [] to deny access
# use standard glob patterns 

# you can set even not existing directories, agent will create it automatically
read_patterns = ['**/*']
write_patterns = []

[model]
# ollama / openrouter
provider = "openrouter"
# optional 
# llm_url = "http://localhost:11434/v1"


use_vision = false # image read support
# name = "openai/gpt-oss-120b"

name = "dots-studio/dots-3-note-preview:free"
# name = "HauhauCS/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive:Q6_K_P"

# set to -1 set infinity length
context_sliding_window = 10
temperature = 0
max_completion_tokens = 8000
timeout =  60
max_retries = 3

[model.ollama]
# ollama provider timeout, set to 0 for disabling
stream_chunk_timeout=0

# https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
[model.reasoning]
max_tokens = 20000
# effort = "medium"


# openrouter 
# ----------------------
[model.extra_body]
repetition_penalty = 1.2

# [model.extra_body.provider]
# data_collection = "deny"